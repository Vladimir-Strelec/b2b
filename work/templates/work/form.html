{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
  <div class="card form-card">
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {{ form.as_div }}
      <button type="submit" class="btn">Сохранить</button>
      <a class="btn btn-light" href="{% url back %}">Отмена</a>
    </form>
  </div>
{% endblock %}
